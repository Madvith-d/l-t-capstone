services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: academic_assistant
      POSTGRES_USER: academic
      POSTGRES_PASSWORD: academic
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academic -d academic_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      app_network:
        aliases:
          - postgres

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://academic:academic@postgres:5432/academic_assistant
      EMBEDDING_CACHE_DIR: /models/fastembed
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure:5
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./data:/app/data
      - embedding_cache:/models/fastembed
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      HOSTNAME: 0.0.0.0
      PORT: 3000
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres_data:
  embedding_cache:

networks:
  app_network:
    driver: bridge

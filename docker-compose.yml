services:
  # Exposes the host's loopback-only Ollama daemon to Linux containers without
  # installing Ollama or copying its models into Docker.
  ollama-bridge:
    image: alpine/socat:1.8.0.3
    network_mode: host
    command:
      - "TCP-LISTEN:${OLLAMA_BRIDGE_PORT:-11435},fork,reuseaddr"
      - "TCP:127.0.0.1:11434"
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: academic_assistant
      POSTGRES_USER: academic
      POSTGRES_PASSWORD: academic
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academic -d academic_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      app_network:
        aliases:
          - postgres

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://academic:academic@postgres:5432/academic_assistant
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-gemma4:e2b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11435}
      EMBEDDING_CACHE_DIR: /models/fastembed
    depends_on:
      postgres:
        condition: service_healthy
      ollama-bridge:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure:5
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./data:/app/data
      - ./evaluation:/app/evaluation
      - embedding_cache:/models/fastembed
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_REQUEST_TIMEOUT_MS: ${NEXT_PUBLIC_REQUEST_TIMEOUT_MS:-45000}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      HOSTNAME: 0.0.0.0
      PORT: 3000
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres_data:
  embedding_cache:

networks:
  app_network:
    driver: bridge
